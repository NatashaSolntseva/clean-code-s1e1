<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css" media="screen">
  </head>
  <body>
    <header class="header">
      <img
        class="header__img"
        src="./eisenhower-matrix.jpg"
        alt="Eisenhower matrix"
      >
      <a
        class="header__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >Want more details?</a>
    </header>
    <main>
      <article class="app">
        <h1 class="app__title">Todo App</h1>
        <section id="add-item-section">
          <h2 class="app__subtitle app__subtitle_type_hidden">Add Item</h2>
          <label class="app__add-label" for="new-task">Add Item</label>
          <div class="app__row-wrapper">
            <input
              id="new-task"
              class="app__input app__input_type_add"
              type="text"
            >
            <button class="app__button app__button_type_add">Add</button>
          </div>
        </section>
        <section>
          <h2 class="app__subtitle">Todo</h2>
          <ul class="app__list" id="incomplete-tasks">
            <li class="app__list-item">
              <input type="checkbox" class="app__input_type_checkbox">
              <label class="app__task-label">Pay Bills</label>
              <input type="text" class="app__input app__input_type_edit">
              <button class="app__button app__button_type_edit">Edit</button>
              <button class="app__button app__button_type_delete">
                <img
                  class="app__button-icon"
                  src="./remove.svg"
                  alt="Delete task"
                >
              </button>
            </li>
            <li class="app__list-item app__list-item_state_edit">
              <input type="checkbox" class="app__input_type_checkbox">
              <label class="app__task-label">Go Shopping</label>
              <input
                type="text"
                value="Go Shopping"
                class="app__input app__input_type_edit"
              >
              <button class="app__button app__button_type_edit">Save</button>
              <button class="app__button app__button_type_delete">
                <img
                  class="app__button-icon"
                  src="./remove.svg"
                  alt="Delete task"
                >
              </button>
            </li>
          </ul>
        </section>
        <section>
          <h2 class="app__subtitle">Completed</h2>
          <ul class="app__list" id="completed-tasks">
            <li class="app__list-item">
              <input
                type="checkbox"
                class="app__input_type_checkbox app__input_type_complete"
                checked
              >
              <label class="app__task-label app__task-label_type_completed">See the Doctor</label>
              <input type="text" class="app__input app__input_type_edit">
              <button class="app__button app__button_type_edit">Edit</button>
              <button class="app__button app__button_type_delete">
                <img
                  class="app__button-icon"
                  src="./remove.svg"
                  alt="Delete task"
                >
              </button>
            </li>
          </ul>
        </section>
      </article>
    </main>    
    <script src="app.js"></script>
  </body>
</html>
